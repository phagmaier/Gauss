<!doctype html>
<!--
  PROTOTYPE, throwaway. Plan task 1.0, piece 4: finding your way in a session.
  SETTLED 2026-11-13.
  Question: how does the learner see where they are in the unit, and how do
  they get out to the course and the library?

  Picked: one slim line across the top. The path (library, course, unit) is
  on the left and "Segment 3 of 5" on the right. Clicking the position opens
  the unit's outline: its segments and the unit gate. The styles are in
  base.css.
  Rejected: a rail down the left that always shows the outline, and a corner
  button with a "Segment 3 of 5" line in the thread at each segment start.

  The course and library links work: they lead to a placeholder with a way
  back. Leaving never asks for confirmation, because progress is saved after
  every answer.
  Keys: Esc closes the outline.

  Everything is simulated. The session is frozen in the discuss phase of the
  third segment; the "ready" button and the message box do nothing here (they
  are pieces 3 and 1). Not in this piece: the course and library views
  themselves, detours, the side pane, "start fresh", exporting a transcript.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauss prototype 4: session navigation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="base.css">
<style>
/* where the course and library links lead, for now */
.away{height:100dvh;display:grid;place-content:center;justify-items:start;gap:.5em;padding:24px}
.away h1{font-size:1.7em;font-weight:600;margin:0}
.away p{margin:0 0 1em;color:var(--soft);max-width:30em}
</style>
</head>
<body>

<div id="app"></div>
<div id="pop"></div>

<script>
/* ---------------- simulated content ---------------- */
const COURSE = 'Calculus I';
const UNIT = {n:3, of:8, name:'Differentiation rules'};
const SEGMENTS = ['Power and sum rules', 'Product and quotient rules', 'The chain rule', 'Implicit differentiation', 'Derivatives of inverse functions'];
const NOW = 2;       // index of the segment in progress
const BEFORE = String.raw`
<div class="qa-card done"><div class="q-count">Question 1 of 1 <span class="ok">Correct</span></div>
  <div class="qa-prompt">What is the derivative of $x^2\sin x$?</div>
  <div class="qa-line"><span class="k">Your answer</span><span>B. $2x\sin x + x^2\cos x$</span><span class="c">90% sure</span></div></div>
<div class="th-tutor prose"><p>Each factor takes its turn being differentiated while the other one waits, and the two results add.</p></div>
<div class="pf-mark"><span><b>Done</b></span></div>
<div class="th-tutor prose"><p>That closes this segment. Next: the chain rule.</p></div>`;
const LESSON = String.raw`
<h1>The chain rule</h1>
<p>Most functions you meet are built by feeding one function into another. Take $h(x) = \sin(x^2)$: first square $x$, then take the sine of the result. The chain rule tells you how fast $h$ changes, given how fast each step changes.</p>
$$\frac{d}{dx}\,f\bigl(g(x)\bigr) = f'\bigl(g(x)\bigr)\cdot g'(x)$$
<p>Read it from the outside in. Differentiate the <strong>outer function</strong> and leave its input alone, then multiply by the derivative of the <strong>inner function</strong>.</p>
<p>For $\sin(x^2)$ the outer derivative is $\cos(x^2)$ and the inner one is $2x$, so $h'(x) = 2x\cos(x^2)$.</p>`;
const AFTER = String.raw`
<div class="pf-mark"><span><b>Discuss</b> Ask anything. Nothing here is graded.</span></div>
<div class="th-you">Why isn't the answer just $\cos(2x)$?</div>
<div class="th-tutor prose"><p>Because the sine never sees $2x$. It sees $x^2$, so that is where its rate, $\cos$, is measured. The $2x$ is how fast that input is moving, and it multiplies.</p></div>
<div class="th-tutor prose"><p>You have the idea. When you are ready, I have one question to check it.</p></div>
<div class="pf-act"><button type="button" class="btn sm">I'm ready for the check</button></div>`;

/* ---------------- state ---------------- */
let view = 'session';      // or 'course', 'library'
let open = false;          // the outline panel

/* ---------------- parts ---------------- */
const $ = s => document.querySelector(s);
const app = $('#app'), pop = $('#pop');
const math = el => window.renderMathInElement && renderMathInElement(el, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false});
const SEND_ICON = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14.5v-11M4.5 8 9 3.5 13.5 8"/></svg>';
const POSITION = `Segment ${NOW + 1} of ${SEGMENTS.length}`;
const state = i => i < NOW ? 'past' : i === NOW ? 'now' : '';
const crumbs = last => `<nav class="crumbs" aria-label="Where this session sits"><button type="button" data-go="library">Library</button><span>/</span><button type="button" data-go="course">${COURSE}</button>${last ? `<span>/</span><b>${last}</b>` : ''}</nav>`;
function outline(){        // the path out, the unit, its segments, and the gate that closes it
  return `<div class="uo">${crumbs()}
    <div class="uo-unit"><span>Unit ${UNIT.n} of ${UNIT.of}</span><b>${UNIT.name}</b></div>
    <ol class="uo-list">${SEGMENTS.map((s, i) => `<li class="${state(i)}"${i === NOW ? ' aria-current="step"' : ''}><i></i>${s}</li>`).join('')}<li class="gate"><i></i>Unit gate</li></ol></div>`;
}
function sessionView(){
  const ticks = SEGMENTS.map((_, i) => `<i class="${state(i)}"></i>`).join('');
  return `<div class="th has-top"><header class="nl">${crumbs(UNIT.name)}
    <button type="button" class="nl-pos" data-act="outline" aria-expanded="false"><span class="ticks" aria-hidden="true">${ticks}</span>${POSITION}</button></header>
    <div class="th-scroll"><div class="th-col">${BEFORE}<div class="ns-new"><div class="th-tutor prose">${LESSON}</div></div>${AFTER}</div></div>
    <div class="th-foot"><form class="box"><textarea rows="1" placeholder="Message the tutor" aria-label="Message"></textarea><button class="send" aria-label="Send" disabled>${SEND_ICON}</button></form></div></div>`;
}

/* where the links lead until those views are designed */
const awayView = () => `<div class="away"><h1>${view === 'course' ? COURSE : 'Library'}</h1>
  <p>The ${view} view is a later piece. You left without being asked anything: your place in the session is saved.</p>
  <button type="button" class="btn" data-go="session">Back to the session</button></div>`;

/* ---------------- render and input ---------------- */
function render(){
  setOpen(false);
  app.innerHTML = view !== 'session' ? awayView() : sessionView();
  math(app);
  const s = $('.th-scroll'); if (s) s.scrollTop = s.scrollHeight;
}
function setOpen(to){
  open = to;
  pop.innerHTML = open ? `<div class="np" role="dialog" aria-label="Unit outline">${outline()}</div>` : '';
  $('[data-act=outline]')?.setAttribute('aria-expanded', open);
}
document.addEventListener('click', e => {
  const go = e.target.closest?.('[data-go]');
  if (go) { view = go.dataset.go; render(); return; }
  if (e.target.closest?.('[data-act=outline]')) { setOpen(!open); return; }
  if (open && !e.target.closest?.('#pop')) setOpen(false);
});
app.addEventListener('submit', e => e.preventDefault());   // sending messages is piece 1; not wired here
document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) setOpen(false); });
render();
</script>
</body>
</html>
