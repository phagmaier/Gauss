<!doctype html>
<!--
  PROTOTYPE, throwaway. Plan task 5.17, piece 20: the course view in the
  redesign's look (look.css).
  SETTLED 2026-11-19: the user took only the units in progress open, and a
  planning conversation behind "Change the curriculum". Rejected: every
  unit open; a request box answered by one planner call; asking in a
  unit's chat.

  What it answers, from the user's notes of 2026-11-19:
  - The view goes down to objectives: each unit a heading with its count
    ("1 of 2") and its status form, each objective a row with its form and
    status word, and "Next" on the one to do. A unit not started has no
    objectives yet (its planner writes them when it first opens), so it
    shows its goal, with Start and Test out.
  - How many objectives are due for review, with "Review now" (tasks 5.24
    and 5.25 build them; this places them).
  - "Change the curriculum", always there, and on a finished course the
    top card's step: it opens a planning conversation of the course, so a
    finished course can add its next stretch.
  - At 30 units ("Calculus 1 to 3" in the bar) the list must still read;
    the bar compares every unit open with only the units in progress open.
  - The top line carries "Course map" and "What I know", as in a unit.

  The bar at the bottom left switches the course, its state, how the units
  fold, the theme and the label type. Keys: M the course map, Esc closes,
  H hides the bar.

  Everything is simulated. Start, Continue, the notes and "What I know" do
  nothing; "Change the curriculum" and "Plan what comes next" show the
  conversation's opening.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauss prototype 20: the course view</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/computer-modern@0.1.3/cmu-serif.css">
<link rel="stylesheet" href="look.css">
</head>
<body>
<div id="app"></div>
<div id="bar"></div>

<script>
/* ---------------- simulated content ---------------- */
// a unit: [title, goal, prerequisites, objectives as [statement, status]]; no objectives until it is opened
const CALC1 = [
  ['Limits', 'Find limits from tables, graphs and algebra.', [], [['Compute a limit from a table of values', 'kept'], ['Evaluate a limit by simplifying first', 'slip']]],
  ['The derivative', 'Define the derivative as a limit and read it as a slope.', [1], [['State the derivative as a limit of difference quotients', 'pass'], ['Read a derivative as the slope of a tangent', 'pass']]],
  ['Differentiation rules', 'Differentiate sums, products, quotients and compositions.', [2],
    [['Differentiate a polynomial term by term', 'pass'], ['Use the power rule for any real exponent', 'pass'], ['Differentiate a product of two functions', 'pass'],
     ['Differentiate a quotient of two functions', 'pass'], ['Differentiate a composition with the chain rule', 'not'], ['Pick out the inner and the outer function', 'not'],
     ['Differentiate an equation in x and y implicitly', 'not'], ['Find the derivative of an inverse from the original', 'not']]],
  ['Optimisation', 'Find the largest and smallest values of a function on an interval.', [3], null],
  ['The integral', 'Define the integral as the limit of sums of areas.', [2], [['Write a Riemann sum for an area', 'att'], ['Explain the integral as a limit of Riemann sums', 'not']]],
  ['The fundamental theorem', 'Connect derivatives and integrals.', [3, 5], null],
  ['Related rates', 'Relate the rates of quantities tied by an equation.', [4], null],
  ['Series', 'Decide when an infinite sum converges.', [6], null],
];
const NOW1 = 3;   // the unit the card leads to, by number
const TITLES30 = ['Functions and graphs', 'Limits', 'Continuity', 'The derivative', 'Differentiation rules', 'The chain rule', 'Implicit differentiation', 'Related rates',
  'Curve sketching', 'Optimisation', 'The definite integral', 'The fundamental theorem', 'Substitution', 'Integration by parts', 'Partial fractions', 'Improper integrals',
  'Areas and volumes', 'Sequences', 'Series and convergence tests', 'Power series', 'Taylor series', 'Vectors and the dot product', 'Lines and planes', 'Partial derivatives',
  'Gradients and directional derivatives', 'Multiple integrals', 'Change of variables', 'Line integrals', "Green's theorem", 'Stokes and divergence'];
const PRE30 = [[], [1], [2], [2], [4], [5], [6], [7], [5], [9], [3], [11, 4], [12], [12], [13], [14], [12], [2], [18], [19], [20], [1], [22], [6, 22], [24], [24, 17], [26], [25], [28], [28]];
const CALC30 = TITLES30.map((t, i) => {
  const n = i + 1;
  const objs = n <= 4 ? [[`State the main idea of ${t.toLowerCase()}`, n === 2 ? 'slip' : n === 1 ? 'kept' : 'pass'], [`Use ${t.toLowerCase()} in a worked problem`, 'pass'], [`Explain why it holds`, n === 3 ? 'kept' : 'pass']]
    : n === 5 ? [['Differentiate a polynomial term by term', 'pass'], ['Differentiate a product of two functions', 'not'], ['Differentiate a quotient of two functions', 'not']]
    : null;
  return [t, `Work with ${t.toLowerCase()}.`, PRE30[i], objs];
});
const WORD = {pass: 'Passed', kept: 'Retained', slip: 'Slipping', att: 'Not passed yet', not: 'Not started', over: 'Overridden'};

/* ---------------- state ---------------- */
const st = {course: 'calc1', state: 'progress', fold: 'open', theme: 'frappe', label: 'mono', map: false, view: 'course', expanded: new Set()};
const $ = s => document.querySelector(s);
const app = $('#app');
const sg = s => `<i class="sg ${s}" aria-hidden="true"></i>`;
const MAP = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="1.5" width="5" height="3.5" rx="1"/><rect x="9.5" y="6.25" width="5" height="3.5" rx="1"/><rect x="1.5" y="11" width="5" height="3.5" rx="1"/><path d="M4 5v6M6.5 3.25h3v3"/></svg>';
const CHEV = '<svg class="chev" width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4.5 3 7.5 6 4.5 9"/></svg>';
const SEND = '<svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14.5v-11M4.5 8 9 3.5 13.5 8"/></svg>';

function course() {
  const big = st.course === 'calc30';
  let units = big ? CALC30 : CALC1;
  if (st.state === 'finished') units = units.map(([t, g, p, o]) => [t, g, p, (o || [[`State the main idea of ${t.toLowerCase()}`], [`Use ${t.toLowerCase()} in a worked problem`]]).map(([s, x], j) => [s, x === 'slip' ? 'slip' : j === 1 && t.length % 3 === 0 ? 'kept' : 'pass'])]);
  return {title: big ? 'Calculus 1 to 3' : 'Calculus I', units, now: big ? 5 : NOW1, due: big ? 4 : 3};
}
const passed = s => s === 'pass' || s === 'kept';
function unitState(objs, n, c) {
  if (!objs) return 'not';
  if (objs.every(([, s]) => passed(s) || s === 'slip')) return 'pass';
  return n === c.now ? 'now' : 'att';
}

/* ---------------- the course view ---------------- */
function unitRow([t, goal, pre, objs], i, c) {
  const n = i + 1, s = unitState(objs, n, c), fin = s === 'pass';
  const npass = objs ? objs.filter(([, x]) => passed(x)).length : 0;
  const count = objs ? `${npass} of ${objs.length}` : '';
  const open = st.fold === 'open' ? true : st.expanded.has(n) || (st.state !== 'finished' && (s === 'now' || s === 'att'));
  const nextIdx = s === 'now' || s === 'att' ? objs.findIndex(([, x]) => !passed(x)) : -1;
  const obs = objs ? `<ul class="ob">${objs.map(([o, x], j) => {
    const isNext = j === nextIdx && s === 'now';
    return `<li class="${x === 'not' ? 'todo' : ''} ${isNext ? 'nx-ob' : ''}">${sg(isNext ? 'now' : x)}<span>${o}</span><span class="st ${isNext ? 'next' : x}">${isNext ? 'Next' : WORD[x]}</span></li>`;
  }).join('')}</ul>` : `<p class="cu-g">${goal} Its objectives are set when it starts.</p>`;
  const acts = [pre.length ? `<span>Builds on ${pre.length > 1 ? 'units ' + pre.join(' and ') : 'unit ' + pre[0]}</span>` : '',
    !objs ? '<button class="link" type="button">Start</button><button class="link" type="button">Test out</button>'
      : fin ? '<button class="link" type="button">Open</button><button class="link" type="button">Notes</button>'
      : '<button class="link" type="button">Continue</button>'].join('');
  return `<li class="${open ? '' : 'fold'} ${fin ? 'fin' : ''} ${s === 'now' ? 'here' : ''}" id="u-${n}">
    <button class="cu-h" type="button" data-unit="${n}" aria-expanded="${open}"><span class="n">Unit ${n}</span><span class="title">${t}</span>
      <span class="cnt">${count}${count ? ' passed' : ''}${sg(s)}${st.fold === 'open' ? '' : CHEV}</span></button>${obs}<div class="cu-a">${acts}</div></li>`;
}
function courseView() {
  const c = course(), fin = st.state === 'finished';
  const nUnits = c.units.length, nFin = fin ? nUnits : c.units.filter((u, i) => unitState(u[3], i + 1, c) === 'pass').length;
  const objs = c.units.flatMap(u => u[3] || []), nObj = objs.length, nPass = objs.filter(([, x]) => passed(x)).length;
  const nowU = c.units[c.now - 1];
  const card = fin
    ? `<div class="nx"><div><div class="lbl">Course finished</div><div class="title">Every unit is finished</div>
        <div class="at">${st.course === 'calc30' ? 'The plan named the next stretch: Calculus 2, series and integration techniques.' : 'To go further, plan more units: the planner sees what you know.'}</div></div>
        <div class="go"><button class="btn" type="button" data-act="change">Plan what comes next</button></div></div>`
    : `<div class="nx"><div><div class="lbl on">In progress</div><div class="title"><span class="lbl" style="font-size:12px;margin-right:.6em;vertical-align:.2em">Unit ${c.now}</span>${nowU[0]}</div>
        <div class="at"><span class="ticks" aria-hidden="true"><i class="past"></i><i class="past"></i><i class="now"></i><i></i><i></i></span>Segment 3 of 5: The chain rule</div></div>
        <div class="go"><button class="btn" type="button">Continue</button></div>
        ${st.course === 'calc1' ? '<div class="also"><span>Also in progress: unit 5, The integral</span><button class="link" type="button">Continue</button></div>' : ''}</div>`;
  return `<div class="pg ${st.map ? 'pane' : ''}"><header class="top"><nav class="path"><a class="home" href="21-library.html">Gauss</a><span class="sep">/</span><span class="here"><span class="t">${c.title}</span></span></nav>
      <div class="acts"><button class="tb" type="button" data-act="map" aria-pressed="${st.map}">${MAP}Course map</button><button class="tb" type="button">What I know</button></div></header>
    <div class="pg-scroll"><div class="pg-col">
      <h1 class="title">${c.title}</h1>
      <div class="meta"><span><b>${nUnits}</b> units</span><span><b>${nFin}</b> finished</span><span><b>${fin ? nObj : nPass}</b> of ${nObj} objectives passed${fin ? '' : ' in the units started'}</span></div>
      <div class="duebar"><span class="due-dot"></span><span><b style="font-weight:500">${c.due} objectives</b> <span class="k">are due for review</span></span><button class="btn sm quiet" type="button">Review now</button></div>
      ${card}
      <div class="sec"><span class="lbl">Units</span><div class="acts"><button class="link" type="button" data-act="change">Change the curriculum</button></div></div>
      <ul class="cu">${c.units.map((u, i) => unitRow(u, i, c)).join('')}</ul>
    </div></div>${st.map ? mapPane(c) : ''}</div>`;
}
function mapPane(c) {
  const st2 = (u, i) => { const s = unitState(u[3], i + 1, c); return st.state === 'finished' ? 'pass' : s; };
  return `<aside class="pane-side" aria-label="Course map"><div class="pane-h"><span class="lbl">Course map</span><span class="title">${c.title}</span>
    <button class="pane-x" type="button" data-act="map" aria-label="Close">✕</button></div><div class="pane-b">
    <div class="legend">${[['pass', 'Finished'], ['now', 'Continue here'], ['att', 'Started'], ['not', 'Not started']].map(([k, w]) => `<span>${sg(k)}${w}</span>`).join('')}</div>
    <ul class="dl">${c.units.map((u, i) => { const s = st2(u, i); return `<li class="${s === 'now' ? 'here' : s === 'not' ? 'todo' : ''}"><span class="n">${i + 1}</span>${sg(s)}<span class="t">${u[0]}</span><span class="pre">${u[2].length ? 'needs ' + u[2].join(', ') : ''}</span></li>`; }).join('')}</ul>
    <p class="proto">The pane shows the diagram when it is wide enough for distinct lines (piece 19); this is the numbered form it falls back to.</p></div></aside>`;
}

/* ---------------- the planning conversation "Change the curriculum" opens ---------------- */
function changeView() {
  const c = course(), fin = st.state === 'finished';
  const opener = fin
    ? (st.course === 'calc30'
      ? `<p>You have finished Calculus 1. When we planned the course I named what would come next: Calculus 2, on integration techniques and series, then Calculus 3, on several variables.</p><p>Shall I plan Calculus 2 now, or is there something you would rather do first? I can see what you have passed, what has stayed and what is slipping, and I will start the next stretch with what needs going over.</p>`
      : `<p>Every unit of ${c.title} is finished. What would you like to do next: go further in the same direction, or go back over something?</p><p>I can see what you have passed, what has stayed and what is slipping.</p>`)
    : `<p>What would you like to change? I can add, drop, reorder or reword units. A unit you have started can be renamed or given a new prerequisite, but not dropped.</p>`;
  return `<div class="th"><header class="top"><nav class="path"><a class="home" href="21-library.html">Gauss</a><span class="sep">/</span><button type="button" data-act="back">${c.title}</button><span class="sep">/</span>
      <span class="here"><span class="t">Changing the curriculum</span></span></nav></header>
    <div class="th-scroll"><div class="th-col">
      <section class="seg"><div class="lbl">Planning</div><h2 class="title">${fin ? 'What comes next' : 'Changing the curriculum'}</h2>
        <ul class="seg-objs"><li><span>${c.units.length} units now. Nothing changes until you apply a proposal.</span></li></ul></section>
      <div class="tutor read">${opener}</div>
      <p class="proto">The conversation runs as the intake does (pieces 8 and 9): the planner asks, then proposes, and the proposal is the curriculum change card a unit's tutor already sends, with the changes marked and Apply or "Keep the current one". Applying returns to the course view.</p>
    </div></div>
    <div class="th-foot"><form class="box"><textarea rows="1" placeholder="Message the planner" aria-label="Message"></textarea><button class="send" aria-label="Send" disabled>${SEND}</button></form></div></div>`;
}

/* ---------------- render and input ---------------- */
function render() {
  document.documentElement.dataset.theme = st.theme;
  document.documentElement.dataset.label = st.label;
  app.innerHTML = st.view === 'change' ? changeView() : courseView();
  bar();
}
document.addEventListener('click', e => {
  const t = e.target.closest?.('[data-act],[data-unit],[data-bar]');
  if (!t) return;
  if (t.dataset.bar) { const [k, v] = t.dataset.bar.split(':'); st[k] = v; st.expanded.clear(); render(); return; }
  if (t.dataset.unit) { if (st.fold === 'open') return; const n = +t.dataset.unit; const li = t.parentElement;
    if (li.classList.contains('fold')) st.expanded.add(n); else st.expanded.delete(n);
    li.classList.toggle('fold'); t.setAttribute('aria-expanded', !li.classList.contains('fold')); return; }
  const act = t.dataset.act;
  if (act === 'map') { st.map = !st.map; render(); }
  if (act === 'change') { st.view = 'change'; st.map = false; render(); }
  if (act === 'back') { st.view = 'course'; render(); }
});
app.addEventListener('submit', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.target.matches?.('textarea,input')) return;
  if (e.key === 'Escape' && st.map) { st.map = false; render(); }
  if (e.key === 'm' && st.view === 'course') { st.map = !st.map; render(); }
  if (e.key === 'h') document.body.classList.toggle('nobar');
});
function bar() {
  const grp = (k, label, opts) => `<div class="grp"><span class="lbl0">${label}</span>${opts.map(([v, n]) => `<button type="button" data-bar="${k}:${v}" aria-pressed="${st[k] === v}">${n}</button>`).join('')}</div>`;
  $('#bar').innerHTML = grp('course', 'Course', [['calc1', 'Calculus I, 8 units'], ['calc30', 'Calculus 1 to 3, 30 units']])
    + grp('state', 'State', [['progress', 'In progress'], ['finished', 'Finished']])
    + grp('fold', 'Units', [['open', 'All open'], ['started', 'Units in progress open']])
    + grp('label', 'Labels', [['mono', 'Plex Mono caps'], ['sans', 'Plex Sans caps']])
    + grp('theme', 'Theme', [['frappe', 'Frappé'], ['latte', 'Latte (rough)']])
    + '<div class="keys">M course map · H hides this</div>';
}
render();
</script>
</body>
</html>
