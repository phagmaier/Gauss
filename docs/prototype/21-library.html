<!doctype html>
<!--
  PROTOTYPE, throwaway. Plan task 5.17, piece 21: the library in the
  redesign's look (look.css).
  SETTLED 2026-11-19, as shown.

  What it answers, from the user's notes of 2026-11-19:
  - Courses grouped by where each stands: in progress, drafts (an intake
    whose curriculum is not approved), finished. Finished courses need no
    archive: the user chose deleting without archiving (task 5.18).
  - Each row shows how many of its objectives are due for review, when
    any are (task 5.24 builds the count; this places it).
  - A unit's status form for each unit in place of the ticks, so that a
    30-unit course reads as one short row.

  The bar at the bottom left switches the theme and the label type. Rows
  lead to the course view mock (piece 20) for Calculus I; the others do
  nothing. H hides the bar.

  Everything is simulated.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauss prototype 21: the library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/computer-modern@0.1.3/cmu-serif.css">
<link rel="stylesheet" href="look.css">
</head>
<body>
<div id="app"></div>
<div id="bar"></div>

<script>
/* ---------------- simulated content ---------------- */
// [title, one-off, where it stands, when, due, unit forms (p passed, k kept-only, n current, a started, . not), link]
const GROUPS = [
  ['In progress', [
    ['Calculus I', false, 'Unit 3 of 8: Differentiation rules, segment 3 of 5', 'Yesterday', 3, 'ppnaa...', '20-course.html'],
    ['Calculus 1 to 3', false, 'Unit 5 of 30: Differentiation rules, segment 2 of 3', '2 days ago', 4, 'ppppn.........................'],
    ['What is a group?', true, 'Segment 2 of 2', '2 days ago', 0, ''],
    ['Linear algebra for PCA', false, 'Not started. Next: unit 1, Vectors', '4 days ago', 0, '...'],
  ]],
  ['Drafts', [
    ['Topology', false, 'The curriculum is ready for your review', 'Today', 0, ''],
  ]],
  ['Finished', [
    ['Probability', false, 'All 2 units finished, 1 moved on from', 'Last week', 2, 'po'],
    ['The pigeonhole principle', true, 'Passed', 'Last week', 0, ''],
  ]],
];
const FORM = {p: 'pass', n: 'now', a: 'att', '.': 'not', o: 'over'};

const st = {theme: 'frappe', label: 'mono'};
const $ = s => document.querySelector(s);
const sg = s => `<i class="sg ${s}" aria-hidden="true"></i>`;
function row([t, oneOff, at, when, due, units, href], g) {
  const dots = units ? `<span class="units" aria-label="${units.length} units">${[...units].map(c => sg(FORM[c])).join('')}</span>` : '';
  return `<li><a class="lr ${g === 'Finished' ? 'fin' : ''}" href="${href || '#'}"><span class="title">${t}${oneOff ? '<small>One-off</small>' : ''}</span>
    <span class="when">${when}</span><span class="at">${at}</span>${due ? `<span class="due"><span class="due-dot"></span>${due} due for review</span>` : ''}${dots}</a></li>`;
}
function render() {
  document.documentElement.dataset.theme = st.theme;
  document.documentElement.dataset.label = st.label;
  $('#app').innerHTML = `<div class="pg"><header class="top"><nav class="path"><span class="home">Gauss</span></nav>
      <div class="acts"><button class="tb" type="button">Profile</button><button class="btn sm" type="button">New course</button></div></header>
    <div class="pg-scroll"><div class="pg-col">
      <h1 class="title">Library</h1>
      ${GROUPS.map(([g, rows]) => `<div class="sec"><span class="lbl">${g}</span><span class="lbl" style="margin-left:auto">${rows.length}</span></div>
        <ul class="lib">${rows.map(r => row(r, g)).join('')}</ul>`).join('')}
    </div></div></div>`;
  bar();
}
document.addEventListener('click', e => {
  const t = e.target.closest?.('[data-bar]');
  if (t) { const [k, v] = t.dataset.bar.split(':'); st[k] = v; render(); return; }
  const a = e.target.closest?.('a[href="#"]'); if (a) e.preventDefault();
});
document.addEventListener('keydown', e => { if (e.key === 'h') document.body.classList.toggle('nobar'); });
function bar() {
  const grp = (k, label, opts) => `<div class="grp"><span class="lbl0">${label}</span>${opts.map(([v, n]) => `<button type="button" data-bar="${k}:${v}" aria-pressed="${st[k] === v}">${n}</button>`).join('')}</div>`;
  $('#bar').innerHTML = grp('label', 'Labels', [['mono', 'Plex Mono caps'], ['sans', 'Plex Sans caps']])
    + grp('theme', 'Theme', [['frappe', 'Frappé'], ['latte', 'Latte (rough)']])
    + '<div class="keys">H hides this</div>';
}
render();
</script>
</body>
</html>
