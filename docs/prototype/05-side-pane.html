<!doctype html>
<!--
  PROTOTYPE, throwaway. Plan task 1.0, piece 5: artifacts and source passages.
  SETTLED 2026-11-13.
  Question: when the tutor shows an artifact (an interactive aid), or the
  learner opens a citation to see the quoted passage in its source, where does
  it appear?

  Picked: a pane beside the thread, which narrows to make room. The thread
  keeps a small reference to the artifact that closes and reopens the pane,
  and a citation under each quote that opens the passage with the quoted
  sentence highlighted. One thing shows at a time. The styles are in base.css.
  Rejected: putting the artifact and the passage in the thread itself, and a
  sheet that opens over the thread.

  The artifact is live: drag the slider. It runs in a sandboxed frame, as the
  real ones will. Esc closes the pane.

  Everything is simulated, including the source: "Calculus notes" and its
  text are invented for this mock. The top line, the "ready" button and the
  message box do nothing here (they are pieces 4, 3 and 1). Not in this piece:
  several artifacts or passages open at once, resizing the pane, page images
  of a source, the workspace.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauss prototype 5: artifacts and sources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="base.css">
</head>
<body>

<div id="app"></div>

<!-- The artifact: what the tutor would write to artifacts/ as its own HTML file. Shown in a sandboxed frame. -->
<template id="artifact">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  html{color-scheme:dark}
  body{margin:0;padding:18px 20px 20px;background:#292c3c;color:#c6d0f5;font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
  svg{display:block;width:100%;height:auto}
  .axis{stroke:#51576d;stroke-width:1}
  .tick{fill:#838ba7;font-size:11px}
  .curve{fill:none;stroke:#ca9ee6;stroke-width:2}
  .tan{stroke:#e5c890;stroke-width:2;stroke-linecap:round}
  .pt{fill:#e5c890}
  label{display:flex;align-items:center;gap:12px;margin:10px 0 16px;color:#a5adce}
  input{flex:1;accent-color:#ca9ee6}
  output{min-width:3.2em;text-align:right;color:#c6d0f5;font-variant-numeric:tabular-nums}
  .sum{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .sum div{display:grid;gap:1px}
  .sum small{color:#a5adce;font-size:12.5px}
  .sum b{font-weight:500;font-size:21px;font-variant-numeric:tabular-nums}
  .sum i{font-style:normal;color:#838ba7;font-size:19px;padding-bottom:1px}
  .sum .res b{color:#e5c890}
</style>
<svg viewBox="0 0 520 236" role="img" aria-label="The graph of sin of x squared with its tangent line">
  <line class="axis" id="ax"/><g id="ticks"></g>
  <path class="curve" id="curve"/><line class="tan" id="tan"/><circle class="pt" id="pt" r="4.5"/>
</svg>
<label>x <input id="x" type="range" min="0" max="3" step="0.01" value="0.8"><output id="xv"></output></label>
<div class="sum">
  <div><small>Inner rate, 2x</small><b id="inner"></b></div><i>×</i>
  <div><small>Outer rate, cos(x²)</small><b id="outer"></b></div><i>=</i>
  <div class="res"><small>Slope of sin(x²)</small><b id="slope"></b></div>
</div>
<script>
  var W = 520, H = 236, L = 12, R = 12, T = 12, B = 12, X1 = 3, Y = 1.25;
  var sx = function(x){ return L + x / X1 * (W - L - R); }, sy = function(y){ return T + (Y - y) / (2 * Y) * (H - T - B); };
  var el = function(id){ return document.getElementById(id); };
  var d = '';
  for (var i = 0; i <= 300; i++) { var x = X1 * i / 300; d += (i ? 'L' : 'M') + sx(x).toFixed(1) + ' ' + sy(Math.sin(x * x)).toFixed(1); }
  el('curve').setAttribute('d', d);
  var ax = el('ax'); ax.setAttribute('x1', sx(0)); ax.setAttribute('x2', sx(X1)); ax.setAttribute('y1', sy(0)); ax.setAttribute('y2', sy(0));
  var t = '';
  for (var n = 1; n <= 3; n++) t += '<line class="axis" x1="' + sx(n) + '" x2="' + sx(n) + '" y1="' + (sy(0) - 3) + '" y2="' + (sy(0) + 3) + '"/><text class="tick" text-anchor="middle" x="' + sx(n) + '" y="' + (sy(0) + 16) + '">' + n + '</text>';
  el('ticks').innerHTML = t;
  var fmt = function(v){ return (Math.abs(v) < 0.005 ? 0 : v).toFixed(2).replace('-', '−'); };
  function draw(){
    var x = +el('x').value, inner = 2 * x, outer = Math.cos(x * x), slope = inner * outer;
    var px = sx(x), py = sy(Math.sin(x * x));
    var ux = (W - L - R) / X1, uy = -slope * (H - T - B) / (2 * Y), len = Math.hypot(ux, uy), k = 62 / len;
    var tan = el('tan'); tan.setAttribute('x1', px - ux * k); tan.setAttribute('y1', py - uy * k); tan.setAttribute('x2', px + ux * k); tan.setAttribute('y2', py + uy * k);
    el('pt').setAttribute('cx', px); el('pt').setAttribute('cy', py);
    el('xv').textContent = x.toFixed(2); el('inner').textContent = fmt(inner); el('outer').textContent = fmt(outer); el('slope').textContent = fmt(slope);
  }
  el('x').addEventListener('input', draw); draw();
</script>
</template>

<script>
/* ---------------- simulated content ---------------- */
const COURSE = 'Calculus I', UNIT = 'Differentiation rules', SEGMENTS = 5, NOW = 2;
const A = {title:'The slope of sin(x²)', kind:'Interactive'};
const S = {
  title:'Calculus notes', where:'Section 3.4, The chain rule, page 41', short:'Calculus notes, section 3.4, page 41',
  quote:String.raw`A composite function changes at the rate of its outer function, measured at the inner value, multiplied by the rate of the inner function.`,
  before:String.raw`So far every rule has dealt with functions combined side by side: added, multiplied, divided. Composition is different. In $\sin(x^2)$ the square is not next to the sine. It is inside it, and the sine only ever sees its output.`,
  rest:String.raw` In Leibniz's notation the rule almost writes itself: if $y = f(u)$ and $u = g(x)$, then $\frac{dy}{dx} = \frac{dy}{du}\cdot\frac{du}{dx}$.`,
  after:String.raw`The notation invites you to cancel the $du$. That is not a proof, but it is a reliable way to remember which rates are involved.`
};
const LESSON = String.raw`
<h1>The chain rule</h1>
<p>Most functions you meet are built by feeding one function into another. Take $h(x) = \sin(x^2)$: first square $x$, then take the sine of the result. The chain rule tells you how fast $h$ changes, given how fast each step changes.</p>
$$\frac{d}{dx}\,f\bigl(g(x)\bigr) = f'\bigl(g(x)\bigr)\cdot g'(x)$$
<p>Your notes say it in one sentence:</p>`;
const SEE = String.raw`<p>To see the two rates at work, drag the point along the curve.</p>`;
const NOTICE = String.raw`<p>Near $x = 1.25$ the slope is zero even though the inner rate is $2.5$. The <strong>outer rate</strong>, $\cos(x^2)$, is zero there, and a product with a zero in it is zero.</p>`;
const AFTER = String.raw`
<div class="pf-mark"><span><b>Discuss</b> Ask anything. Nothing here is graded.</span></div>
<div class="th-tutor prose"><p>Ask about anything that is unclear. When you are ready, I have one question to check it.</p></div>
<div class="pf-act"><button type="button" class="btn sm">I'm ready for the check</button></div>`;

/* ---------------- state ---------------- */
let open = 'artifact';     // what the pane shows: 'artifact', 'source' or null. The tutor has just shown the artifact.

/* ---------------- parts ---------------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const math = el => window.renderMathInElement && renderMathInElement(el, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false});
const ARTIFACT = '<!doctype html>' + $('#artifact').innerHTML;
const SEND_ICON = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14.5v-11M4.5 8 9 3.5 13.5 8"/></svg>';
const CLOSE_ICON = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"/></svg>';
const AID_ICON = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 15.5h13"/><path d="M3 12c2-7 4-9 6-4s4 3 6-4"/></svg>';
const topLine = () => `<header class="nl"><nav class="crumbs" aria-label="Where this session sits"><button type="button">Library</button><span>/</span><button type="button">${COURSE}</button><span>/</span><b>${UNIT}</b></nav>
  <button type="button" class="nl-pos"><span class="ticks" aria-hidden="true">${Array.from({length:SEGMENTS}, (_, i) => `<i class="${i < NOW ? 'past' : i === NOW ? 'now' : ''}"></i>`).join('')}</span>Segment ${NOW + 1} of ${SEGMENTS}</button></header>`;
const frame = () => `<iframe data-artifact sandbox="allow-scripts" title="${A.title}"></iframe>`;
const passage = () => `<div class="passage"><p>${S.before}</p><p><mark>${S.quote}</mark>${S.rest}</p><p>${S.after}</p></div>`;
const head = (kind, close) => (kind === 'artifact' ? `<b>${A.title}</b><span>${A.kind}</span>` : `<b>${S.title}</b><span>${S.where}</span>`)
  + (close ? `<button type="button" class="sv-close" data-act="close" aria-label="Close">${CLOSE_ICON}</button>` : '');
const viewer = kind => `<div class="sv-head">${head(kind, true)}</div><div class="sv-body">${kind === 'artifact' ? frame() : passage()}</div>`;
const ref = () => `<button type="button" class="ref" data-open="artifact" aria-pressed="${open === 'artifact'}">${AID_ICON}<b>${A.title}</b><span class="k">${A.kind}</span><span class="go">${open === 'artifact' ? 'Showing' : 'Open'}</span></button>`;
const view = () => `<div class="th has-top${open ? ' has-pane' : ''}">${topLine()}
  <div class="th-scroll"><div class="th-col">
    <div class="th-tutor prose">${LESSON}</div>
    <figure class="sq"><blockquote>${S.quote}</blockquote><figcaption><button type="button" class="cite" data-open="source" aria-expanded="${open === 'source'}">${S.short}</button></figcaption></figure>
    <div class="th-tutor prose">${SEE}</div>${ref()}<div class="th-tutor prose">${NOTICE}</div>${AFTER}
  </div></div>
  <div class="th-foot"><form class="box"><textarea rows="1" placeholder="Message the tutor" aria-label="Message"></textarea><button class="send" aria-label="Send" disabled>${SEND_ICON}</button></form></div>
  ${open ? `<aside class="sp" aria-label="${open === 'artifact' ? A.title : S.title}">${viewer(open)}</aside>` : ''}</div>`;

/* ---------------- render and input ---------------- */
function render(){
  const top = $('.th-scroll')?.scrollTop ?? 0;
  app.innerHTML = view();
  math(app);
  for (const f of app.querySelectorAll('iframe[data-artifact]')) f.srcdoc = ARTIFACT;
  $('.th-scroll').scrollTop = top;
}
function show(kind){ open = kind === open ? null : kind; render(); }   // clicking the reference to what is showing closes it
app.addEventListener('click', e => {
  const o = e.target.closest('[data-open]');
  if (o) show(o.dataset.open);
  else if (e.target.closest('[data-act=close]')) show(open);
});
app.addEventListener('submit', e => e.preventDefault());   // sending messages is piece 1; not wired here
document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) show(open); });
render();
</script>
</body>
</html>
