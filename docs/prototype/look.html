<!doctype html>
<!--
  PROTOTYPE, throwaway. Plan task 1.0 pulled forward.
  Question: what should Gauss look like?
  Round 2 (2026-11-13): D combines the user's picks (A's look, C's map and
  clarity, a chat layout with one message box). A and C kept for comparison;
  B (Workbench) dropped. Switch with
  ?variant=D|A|C&view=library|course|session&phase=teach|discuss|check|graded
  or the floating bar at the bottom (arrow keys cycle variants, H hides the bar).
  All data is simulated. No backend, no persistence, grading is canned.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauss look prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Caveat:wght@500;600&family=Recursive:slnt,wght,CASL,MONO@-15..0,300..800,0..1,0..1&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.katex{font-size:1.06em}

/* ---------- prototype switcher (deliberately not part of any design) ---------- */
#bar{position:fixed;left:12px;bottom:12px;z-index:1000;
  display:flex;align-items:center;gap:6px;padding:5px 8px;background:#fff;color:#111;
  border:2px dashed #ff2d95;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.25);
  font:13px/1.2 system-ui,sans-serif;white-space:nowrap}
#bar .arrow{border:0;border-radius:999px;background:#ff2d95;color:#fff;width:26px;height:26px;padding:0;font-size:15px}
#bar .lbl{min-width:104px;text-align:center;font-weight:600}
#bar select{font:13px system-ui,sans-serif;border:1px solid #ddd;border-radius:999px;padding:3px 6px;background:#f6f6f6;color:#111}
#bar .tag{font-size:11px;color:#ff2d95;font-weight:700}
#toast{position:fixed;left:12px;bottom:62px;z-index:1001;background:#111;color:#fff;
  padding:8px 14px;border-radius:8px;font:13px system-ui,sans-serif;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

/* =====================================================================
   A. FOLIO: a book you work through. Single reading column, margin notes,
   artifacts as inline figures, grading in red pencil.
   ===================================================================== */
.vA{--paper:#F4F6F5;--ink:#1D2433;--faded:#5B6475;--rule:#D3D9DE;--prussian:#24477A;--pencil:#C2362B;--wash:#E8EDF0;
  background:var(--paper);color:var(--ink);font-family:Newsreader,Georgia,serif;font-size:19px;line-height:1.62;
  font-optical-sizing:auto;min-height:100vh;padding-bottom:90px}
.vA a,.vA .lnk{color:var(--prussian);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;background:none;border:0;padding:0;cursor:pointer}
.vA .a-head{display:flex;gap:28px;align-items:baseline;max-width:1180px;margin:0 auto;padding:22px 32px 0;font-size:15px;color:var(--faded);font-style:italic}
.vA .a-head .home{font-style:normal;font-weight:600;color:var(--ink);text-decoration:none;font-size:17px;letter-spacing:.02em}
.vA .a-head .sp{flex:1}
.vA .a-grid{display:grid;grid-template-columns:190px minmax(0,640px) 250px;gap:0 44px;max-width:1180px;margin:0 auto;padding:28px 32px}
.vA .a-rail{position:sticky;top:20px;align-self:start;font-size:15px;line-height:1.45;color:var(--faded)}
.vA .a-rail h4{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 10px}
.vA .a-rail ol{list-style:none;margin:0;padding:0}
.vA .a-rail li{padding:5px 0 5px 22px;position:relative}
.vA .a-rail li .n{position:absolute;left:0;font-variant-numeric:oldstyle-nums}
.vA .a-rail li.done{color:var(--faded)}
.vA .a-rail li.done::after{content:"passed";font-style:italic;font-size:13px;margin-left:6px;color:#2E6B4E}
.vA .a-rail li.cur{color:var(--ink);font-weight:600}
.vA .a-rail .phases{list-style:none;padding:4px 0 0 0;margin:0;font-weight:400}
.vA .a-rail .phases li{padding:2px 0 2px 16px;font-size:14px;color:var(--faded)}
.vA .a-rail .phases li::before{content:"";position:absolute;left:2px;top:12px;width:6px;height:6px;border-radius:50%;border:1px solid var(--faded)}
.vA .a-rail .phases li.now{color:var(--prussian);font-style:italic}
.vA .a-rail .phases li.now::before{background:var(--prussian);border-color:var(--prussian)}
.vA .a-rail .phases li.past::before{background:var(--faded)}
.vA .row{display:contents}
.vA .note{font-size:14.5px;line-height:1.45;color:var(--faded);padding-top:6px}
.vA .note .sup{color:var(--prussian);font-weight:600;margin-right:4px}
.vA .note blockquote{margin:6px 0;padding-left:10px;border-left:2px solid var(--rule);font-style:italic;color:var(--ink)}
.vA .note .ok{color:#2E6B4E;font-style:italic}
.vA h1{font-size:44px;line-height:1.08;font-weight:500;margin:0 0 6px;letter-spacing:-.01em}
.vA .lede{font-style:italic;color:var(--faded);margin:0 0 26px;font-size:18px}
.vA p{margin:0 0 16px;hyphens:auto}
.vA sup.ref{color:var(--prussian);font-weight:600;font-size:.7em;cursor:pointer}
.vA .phase-mark{font-size:15px;font-style:italic;color:var(--faded);margin:30px 0 12px;display:flex;align-items:center;gap:12px}
.vA .phase-mark::after{content:"";flex:1;height:1px;background:var(--rule)}
.vA figure{margin:22px 0 26px;padding:0}
.vA figure .fig{background:#fff;border:1px solid var(--rule);padding:12px}
.vA figcaption{font-size:15px;color:var(--faded);margin-top:8px;font-style:italic}
.vA figcaption b{font-style:normal;color:var(--ink);font-weight:600}
.vA .slider{display:flex;align-items:center;gap:12px;font-size:15px;margin-top:8px}
.vA .slider input{flex:1;accent-color:var(--prussian)}
.vA .slider button{border:1px solid var(--rule);background:#fff;padding:2px 10px;font-size:14px;border-radius:2px;color:var(--faded)}
.vA .slider button.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.vA .dlg p{padding-left:78px;position:relative}
.vA .dlg .who{position:absolute;left:0;width:68px;text-align:right;font-style:italic;color:var(--faded);font-size:16px}
.vA .dlg .you{color:var(--ink)}
.vA .ask{display:flex;gap:16px;align-items:flex-end;margin:22px 0 0 78px}
.vA .ask input{flex:1;border:0;border-bottom:1px solid var(--faded);background:transparent;padding:6px 0;font-style:italic}
.vA .btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:7px 16px;font-size:16px;border-radius:2px}
.vA .btn.ghost{background:transparent;color:var(--ink)}
.vA .exercise{border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:16px 0 20px;margin-top:8px}
.vA .exercise h3{font-size:17px;font-weight:600;margin:0 0 8px}
.vA .exercise .q{font-size:20px;margin-bottom:16px}
.vA label.fld{display:block;font-size:15px;font-style:italic;color:var(--faded);margin:14px 0 4px}
.vA .tex-in{width:100%;font-family:"Recursive",monospace;font-variation-settings:"MONO" 1;font-size:15px;border:1px solid var(--rule);background:#fff;padding:8px 10px;border-radius:2px}
.vA .preview{min-height:44px;padding:8px 0;font-size:20px}
.vA .conf{display:flex;gap:22px;font-size:17px}
.vA .conf button{border:0;background:none;padding:2px 0;border-bottom:1px solid transparent;color:var(--faded)}
.vA .conf button.on{color:var(--ink);border-bottom:2px solid var(--prussian);font-weight:600}
.vA .conf kbd{font-family:inherit;font-size:13px;color:var(--faded);margin-right:3px}
.vA textarea.reason{width:100%;min-height:62px;border:1px solid var(--rule);background:#fff;padding:8px 10px;font-size:16px;border-radius:2px}
.vA .submitrow{display:flex;justify-content:flex-end;margin-top:14px}
.vA .answered{position:relative;padding:4px 0 8px}
.vA .answered .x{position:absolute;left:-58px;top:-12px;font-family:Caveat,cursive;font-size:56px;color:var(--pencil);line-height:1}
.vA .answered .struck{text-decoration:underline wavy var(--pencil);text-decoration-thickness:1.5px;text-underline-offset:8px}
.vA .verdict{font-size:16px;color:var(--pencil);font-style:italic;margin:4px 0 14px}
.vA .redpen{font-family:Caveat,cursive;font-size:23px;line-height:1.15;color:var(--pencil);transform:rotate(-1.5deg);padding-top:2px}
.vA .redpen .katex{font-size:.8em}
.vA .detour{background:var(--wash);border-left:3px solid var(--prussian);padding:14px 18px;margin:20px 0}
.vA .detour p{margin:0 0 12px}
.vA .detour .acts{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.vA .caret{display:inline-block;width:9px;height:1.05em;background:var(--ink);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* Folio: library & course */
.vA .contents{max-width:820px;margin:0 auto;padding:48px 32px}
.vA .contents h1{font-size:64px;margin-bottom:4px}
.vA .contents .sub{font-style:italic;color:var(--faded);margin-bottom:40px}
.vA .contents h2{font-size:17px;font-weight:600;margin:40px 0 4px;color:var(--faded);font-style:italic;font-weight:400}
.vA .toc{list-style:none;margin:0;padding:0}
.vA .toc li{padding:14px 0;border-bottom:1px solid var(--rule)}
.vA .toc .line{display:flex;align-items:baseline;gap:8px;font-size:24px}
.vA .toc .line .t{cursor:pointer}
.vA .toc .line .t:hover{color:var(--prussian)}
.vA .toc .dots{flex:1;border-bottom:2px dotted var(--rule);transform:translateY(-6px)}
.vA .toc .frac{font-size:18px;color:var(--faded);font-variant-numeric:oldstyle-nums}
.vA .toc .next{font-size:16px;font-style:italic;color:var(--faded);margin-top:2px}
.vA .toc .next .lnk{font-style:normal}
.vA .course-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:48px;max-width:1080px;margin:0 auto;padding:40px 32px}
.vA .course-grid h1{font-size:48px}
.vA .units{list-style:none;padding:0;margin:20px 0 0;counter-reset:u}
.vA .units li{display:grid;grid-template-columns:34px 1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.vA .units li .n{font-variant-numeric:oldstyle-nums;color:var(--faded);font-size:20px}
.vA .units li .t{font-size:21px}
.vA .units li .g{grid-column:2;font-size:15.5px;color:var(--faded);font-style:italic}
.vA .units li .s{font-size:14px;color:var(--faded);font-style:italic;text-align:right}
.vA .units li.sel{background:var(--wash);margin:0 -10px;padding:12px 10px}
.vA .units li.cur .t{font-weight:600}
.vA .side-list{font-size:15px;color:var(--faded);margin-top:28px}
.vA .side-list h4{color:var(--ink);font-size:15px;margin:0 0 6px;font-weight:600}
.vA .side-list ul{margin:0;padding-left:16px}

/* =====================================================================
   D. FOLIO + STAGE (round 2). Folio's reading type for what the tutor
   says, a plain sans for the controls, Stage's phase colours and map.
   Sidebar holds the course map; one message box is always at the bottom;
   questions arrive inline in the conversation.
   ===================================================================== */
.vD{--bg:#F6F7F9;--side:#EEF0F4;--surface:#FFFFFF;--ink:#1B2030;--muted:#5F677C;--line:#E1E4EC;--line2:#C9CEDA;--track:#D6DAE4;
  --teach:#4152D6;--discuss:#0E8A78;--check:#B5650A;--teach-t:#ECEEFD;--discuss-t:#E3F4F0;--check-t:#FCF0DE;
  --right:#1E8A4C;--wrong:#C8372D;--wrong-t:#FBEAE8;--on-fill:#FFFFFF;--you:#E9ECF3;--detour:#1B2030;--detour-ink:#FFFFFF;
  background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh}
.vD[data-theme=dark]{--bg:#131722;--side:#181D29;--surface:#1D2331;--ink:#E6E8F0;--muted:#9AA2B7;--line:#2A3142;--line2:#3B4459;--track:#333B4F;
  --teach:#8F9AFF;--discuss:#45CDB4;--check:#F0B24A;--teach-t:#23294C;--discuss-t:#15302B;--check-t:#352A18;
  --right:#5ACB86;--wrong:#FF8277;--wrong-t:#3A2326;--on-fill:#131722;--you:#232A3B;--detour:#E6E8F0;--detour-ink:#131722}
.vD .serif{font-family:Newsreader,Georgia,serif;font-optical-sizing:auto}
.vD .muted{color:var(--muted)}
.vD kbd{font-family:inherit;font-size:11.5px;border:1px solid currentColor;border-radius:4px;padding:0 5px;opacity:.65;margin-left:8px;font-weight:400}
.vD .d-icon{background:none;border:0;padding:7px;border-radius:9px;color:var(--muted);display:inline-grid;place-items:center}
.vD .d-icon:hover{background:var(--line);color:var(--ink)}
.vD .d-word{font-family:Newsreader,serif;font-weight:600;font-size:23px;letter-spacing:-.01em}
.vD .d-btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;font-size:16px;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center}
.vD .d-btn.check{background:var(--check);color:var(--on-fill)}
.vD .d-btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line2)}
.vD .d-btn:disabled{opacity:.35;cursor:not-allowed}
.vD .d-tl{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;font-size:15.5px}

/* session shell */
.vD .d-app{display:grid;grid-template-columns:auto minmax(0,1fr) auto;height:100vh;overflow:hidden}
.vD .d-side{width:272px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 16px 16px;overflow:auto}
.vD .d-sidetop{display:flex;align-items:center;gap:2px;margin-bottom:6px}
.vD .d-sidetop .d-word{margin-right:auto}
.vD .d-back{background:none;border:0;padding:4px 0;color:var(--muted);display:flex;gap:4px;align-items:center;font-size:14.5px;align-self:flex-start}
.vD .d-back:hover{color:var(--ink)}
.vD .d-ctitle{font-size:22px;font-weight:500;margin-top:12px;line-height:1.2}
.vD .d-cmeta{font-size:14px;color:var(--muted)}
.vD .d-mini{margin:12px 0 4px;display:flex;justify-content:center}
.vD .d-mini g{cursor:pointer}
.vD .d-link{background:none;border:0;padding:0;color:var(--teach);font-size:14px;align-self:center;margin-bottom:16px}
.vD .d-sec{font-weight:700;font-size:14.5px;padding-top:16px;margin-bottom:8px;border-top:1px solid var(--line)}
.vD .d-segs{list-style:none;margin:0;padding:0}
.vD .d-segs li{position:relative;padding:3px 0 14px 28px;font-size:15px;color:var(--muted)}
.vD .d-segs li::before{content:"";position:absolute;left:3px;top:6px;width:10px;height:10px;border-radius:50%;border:2px solid var(--line2);background:var(--side);z-index:1}
.vD .d-segs li::after{content:"";position:absolute;left:9px;top:16px;bottom:-4px;width:2px;background:var(--line2)}
.vD .d-segs li:last-child::after{display:none}
.vD .d-segs li.done::before{background:var(--right);border-color:var(--right)}
.vD .d-segs li.done::after{background:var(--right)}
.vD .d-segs li.cur{color:var(--ink);font-weight:700}
.vD .d-segs li.cur::before{border-color:var(--phc);background:var(--phc);box-shadow:0 0 0 4px color-mix(in srgb,var(--phc) 22%,transparent)}
.vD .d-subph{display:flex;gap:4px;margin-top:6px;font-weight:400}
.vD .d-subph span{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.vD .d-subph span.now{background:var(--phc);color:var(--on-fill);font-weight:700}
.vD .d-sidelinks{display:flex;gap:16px;font-size:14.5px;margin-top:8px}
.vD .d-sidelinks button{background:none;border:0;padding:0;color:var(--muted)}
.vD .d-sidelinks button:hover{color:var(--ink)}

.vD .d-main{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;border-top:4px solid var(--phc);transition:border-color .3s}
.vD .d-head{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:12px 32px;border-bottom:1px solid var(--line)}
.vD .d-headl{display:flex;gap:10px;align-items:center;min-width:0}
.vD .d-crumb{font-size:14px;color:var(--muted)}
.vD .d-head h1{font-size:30px;font-weight:500;margin:0;line-height:1.15;letter-spacing:-.01em}
.vD .d-steps{display:flex;align-items:center;justify-content:flex-end}
.vD .d-step{display:flex;align-items:center;gap:7px;font-size:14.5px;color:var(--muted);font-weight:700}
.vD .d-step i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:2px solid var(--line2)}
.vD .d-step.past{color:var(--ink)}
.vD .d-step.past i{border-color:var(--ink)}
.vD .d-step.now{color:var(--c)}
.vD .d-step.now i{background:var(--c);border-color:var(--c);color:var(--on-fill)}
.vD .d-steplink{width:24px;height:2px;background:var(--line2);margin:0 8px}
.vD .d-hint{font-size:14px;color:var(--muted);text-align:right;margin-top:5px}

.vD .d-scroll{overflow:auto}
.vD .d-col{max-width:720px;margin:0 auto;padding:30px 32px 30px}
.vD .tut{font-family:Newsreader,Georgia,serif;font-size:20px;line-height:1.62;margin:0 0 16px}
.vD .d-cite{border:1px solid var(--line2);background:var(--surface);border-radius:999px;font:700 12px "Atkinson Hyperlegible",sans-serif;color:var(--teach);padding:0 7px;vertical-align:3px;margin-left:2px}
.vD .d-quote{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--teach);border-radius:4px 12px 12px 4px;padding:12px 16px;margin:-4px 0 18px;font-size:14.5px;color:var(--muted)}
.vD .d-quote .q{font-family:Newsreader,serif;font-style:italic;font-size:17.5px;color:var(--ink);margin-bottom:4px}
.vD .d-quote .ok{color:var(--right);font-weight:700}
.vD .d-fig{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:6px 0 22px}
.vD .d-fighead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14.5px;gap:12px}
.vD .d-fighead b{font-size:15.5px}
.vD .d-figmini{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px dashed var(--line2);border-radius:14px;padding:10px 16px;margin:6px 0 22px;font-size:15px;color:var(--muted)}
.vD .d-slider{display:flex;gap:12px;align-items:center;font-size:14.5px;margin-top:8px}
.vD .d-slider input{flex:1;accent-color:var(--teach)}
.vD .d-seg2{display:flex;gap:6px;margin-top:10px}
.vD .d-seg2 button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px;font-size:13.5px;color:var(--muted)}
.vD .d-seg2 button.on{border-color:var(--ink);color:var(--ink);font-weight:700}
.vD .d-event{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13.5px;margin:28px 0 18px}
.vD .d-event::before,.vD .d-event::after{content:"";flex:1;height:1px;background:var(--line)}
.vD .d-you{margin:0 0 18px auto;max-width:80%;width:fit-content;background:var(--you);border-radius:18px 18px 4px 18px;padding:10px 16px;font-size:16.5px}
.vD .caret{display:inline-block;width:9px;height:1.05em;background:var(--ink);vertical-align:-2px;animation:blink 1s steps(1) infinite;margin-left:2px}

/* questions */
.vD .d-q{background:var(--surface);border:1.5px solid color-mix(in srgb,var(--check) 50%,transparent);border-radius:18px;padding:20px 22px;margin:6px 0 20px;box-shadow:0 14px 34px -22px color-mix(in srgb,var(--check) 70%,transparent)}
.vD .d-qh{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--check);margin-bottom:8px}

/* ε–δ figure: f(x)=x² near x=2. "working" δ = min(1, ε/5); "yours" δ = min(1, ε/4). */
function epsFig(c){
  const W = 380, H = 230, pad = 26;
  const x0 = 0.6, x1 = 3.4, y0 = -0.5, y1 = 11.5;
  const X = x => pad + (x - x0) / (x1 - x0) * (W - 2*pad);
  const Y = y => H - pad - (y - y0) / (y1 - y0) * (H - 2*pad);
  const eps = S.eps, d = Math.min(1, eps / (S.mode === 'yours' ? 4 : 5));
  const worst = (2 + d) ** 2 - 4, ok = worst < eps + 1e-9;
  let path = ''; for (let i = 0; i <= 80; i++){ const x = x0 + (x1 - x0) * i / 80; path += (i ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(x*x).toFixed(1); }
  let inner = ''; for (let i = 0; i <= 30; i++){ const x = 2 - d + 2*d*i/30; inner += (i ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(x*x).toFixed(1); }
  const boxCol = ok ? c.good : c.bad;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Graph of x squared near 2 with epsilon and delta bands" style="display:block;font-family:inherit">
    <rect x="${pad}" y="${Y(4+eps)}" width="${W-2*pad}" height="${Y(4-eps)-Y(4+eps)}" style="fill:${c.eps};opacity:.2"/>
    <rect x="${X(2-d)}" y="${pad}" width="${X(2+d)-X(2-d)}" height="${H-2*pad}" style="fill:${c.delta};opacity:.2"/>
    <line x1="${pad}" x2="${W-pad}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:${c.axis};stroke-width:1"/>
    <line x1="${X(1)}" x2="${X(1)}" y1="${pad}" y2="${H-pad}" style="stroke:${c.axis};stroke-width:.5;stroke-dasharray:2 3"/>
    <path d="${path}" style="fill:none;stroke:${c.curve};stroke-width:1.6"/>
    <path d="${inner}" style="fill:none;stroke:${boxCol};stroke-width:3.2"/>
    <rect x="${X(2-d)}" y="${Y(Math.min(4+eps, y1))}" width="${X(2+d)-X(2-d)}" height="${Y(Math.max(4-eps,y0))-Y(Math.min(4+eps,y1))}" style="fill:none;stroke:${boxCol};stroke-width:1;stroke-dasharray:4 3"/>
    <circle cx="${X(2)}" cy="${Y(4)}" r="3.5" style="fill:${c.bg};stroke:${c.curve};stroke-width:1.5"/>
    <text x="${W-pad}" y="${Y(4+eps)-5}" text-anchor="end" style="font-size:11px;fill:${c.text}">4 + ε</text>
    <text x="${X(2+d)+4}" y="${H-pad-6}" style="font-size:11px;fill:${c.text}">2 + δ</text>
    <text x="${pad+2}" y="${pad+2}" style="font-size:11.5px;fill:${boxCol}">${ok ? 'curve stays inside the box' : 'curve leaves the box'}</text>
  </svg>
  <div style="font-size:.82em;margin-top:6px;color:${c.text}">ε = ${eps.toFixed(2)}, δ = ${d.toFixed(3)}; largest |x² − 4| in the δ band is ${worst.toFixed(3)} ${ok ? '&lt;' : '&gt;'} ε</div>`;
}

}

/* layered DAG layout for the curriculum diagram */
function layout(dir, gx, gy, pad){
  const layers = {};
  COURSE.units.forEach(u => (layers[u.L] = layers[u.L] || []).push(u));
  const maxN = Math.max(...Object.values(layers).map(l=>l.length));
  const pos = {};
  Object.entries(layers).forEach(([L, us]) => us.forEach((u, i) => {
    const a = +L * gx + pad, b = (i - (us.length - 1) / 2) * gy + ((maxN - 1) / 2) * gy + pad;
    pos[u.id] = dir === 'h' ? {x:a, y:b} : {x:b, y:a};
  }));
  const nL = Object.keys(layers).length;
  const size = dir === 'h' ? {w:(nL-1)*gx + 2*pad, h:(maxN-1)*gy + 2*pad} : {w:(maxN-1)*gy + 2*pad, h:(nL-1)*gx + 2*pad};
  return {pos, ...size};
}
function edges(pos, dir, cls){
  let out = '';
  COURSE.units.forEach(u => u.deps.forEach(d => {
    const a = pos[d], b = pos[u.id];
    const m = dir === 'h' ? `M${a.x} ${a.y} C${(a.x+b.x)/2} ${a.y} ${(a.x+b.x)/2} ${b.y} ${b.x} ${b.y}` : `M${a.x} ${a.y} C${a.x} ${(a.y+b.y)/2} ${b.x} ${(a.y+b.y)/2} ${b.x} ${b.y}`;
    out += `<path d="${m}" class="${cls}"/>`;
  }));
  return out;
}

function dMiniMap(){

function dLine(units, r=5, gap=22){

}

        ${u.id==='u3'?OBJECTIVES.map(o=>`<div class="obj">${tx(o.t)}<span class="st ${o.s==='passed'?'p':o.s==='working'?'w':''}">${o.s}</span></div>`).join('')+`<div class="acts"><button class="cbtn" style="background:var(--check)" data-act="view:session">Resume segment 3</button></div>`
          : `<p style="color:var(--mute)">Objectives are planned when the unit starts.</p>`}</div>
      <div class="aside"><h4>Notes</h4><ul><li>Functions and notation</li><li>Limits, intuitively</li></ul><h4>Sources</h4><ul><li>analysis-notes.pdf</li></ul><h4>Teaching style</h4><ul style="list-style:none;padding:0"><li>Short explanations, many small proofs, one worked example per idea.</li></ul></div></div></div></div>`;
  },
};

/* ------------------------------------------------------------------ render & events */
const IMPL = {D, A, C};
function render(){
  const root = document.getElementById('root');
  const sc = document.querySelector('.d-scroll'), keep = sc ? sc.scrollTop : null;
  root.className = 'v' + S.variant;
  root.dataset.theme = S.theme;
  root.innerHTML = IMPL[S.variant][S.view]();
  const sc2 = document.querySelector('.d-scroll');
  if (sc2) sc2.scrollTop = (S.toBottom || keep == null) ? sc2.scrollHeight : keep;
  S.toBottom = false;
  document.getElementById('bar').innerHTML = `<span class="tag" title="Press H to hide this bar">PROTOTYPE</span><button class="arrow" data-act="prev" aria-label="Previous variant">‹</button><span class="lbl">${S.variant} ${NAMES[S.variant]}</span><button class="arrow" data-act="next-variant" aria-label="Next variant">›</button>
    <select id="sel-view" aria-label="View">${VIEWS.map(v=>`<option ${S.view===v?'selected':''}>${v}</option>`).join('')}</select>${S.view==='session'?`<select id="sel-phase" aria-label="Phase">${PHASES.map(p=>`<option ${S.phase===p?'selected':''}>${p}</option>`).join('')}</select>`:''}`;
  document.title = `Gauss ${S.variant} ${NAMES[S.variant]}`;
  syncURL();
}
function cycle(d){ S.variant = VARIANTS[(VARIANTS.indexOf(S.variant) + d + VARIANTS.length) % VARIANTS.length]; S.overlay = null; render(); window.scrollTo(0,0); }
function setPhase(v){
  S.phase = v; S.mode = v==='graded' ? 'yours' : 'working'; if (v==='graded') S.eps = 4;
  if (v==='check'){ S.q = 1; S.pick = null; S.conf1 = null; }
  if (v==='graded') S.q = 2;
  S.toBottom = true; render();
}
function setConf(v){ if (S.variant==='D' && S.phase==='check' && S.q===1) S.conf1 = v; else S.conf = v; render(); }

document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-act]')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  e.preventDefault();
  const [a, v] = el.dataset.act.split(':');
  if (a==='prev') return cycle(-1);
  if (a==='next-variant') return cycle(1);
  if (a==='view'){ S.view = v; S.overlay = null; render(); return window.scrollTo(0,0); }
  if (a==='phase') return setPhase(v);
  if (a==='conf') return setConf(v);
  if (a==='pick'){ S.pick = +v; render(); return; }
  if (a==='ready') return setPhase('check');
  if (a==='submit'){
    if (S.variant==='D' && S.phase==='check' && S.q===1){ if (S.pick==null || !S.conf1) return; S.q = 2; S.toBottom = true; render(); return; }
    S.phase = 'graded'; S.mode = 'yours'; S.eps = 4; S.toBottom = true; render(); return;
  }
  if (a==='unit'){ S.unit = v; render(); return; }
  if (a==='unitmap'){ S.unit = v; S.view = 'course'; render(); return window.scrollTo(0,0); }
  if (a==='mode'){ S.mode = v; render(); return; }
  if (a==='overlay'){ S.overlay = 'fig'; render(); return; }
  if (a==='overlay-close'){ S.overlay = null; render(); return; }
  if (a==='cite'){ S.showSource = !S.showSource; render(); return; }
  if (a==='side'){ S.side = !S.side; render(); return; }
  if (a==='theme'){ S.theme = S.theme==='dark' ? 'light' : 'dark'; render(); return; }
  if (a==='dpane'){ S.dpane = true; render(); return; }
  if (a==='dpane-close'){ S.dpane = false; render(); return; }
  if (a==='seefig'){ S.dpane = true; S.mode = 'yours'; S.eps = 4; render(); return; }
  if (a==='detour') return toast('A detour would start here: the tutor asks you to walk through your steps.');
  if (a==='dispute') return toast('A dispute form would open here. Not in the prototype.');
  if (a==='next') return toast('Would move to segment 4, recorded as a miss on this objective.');
  toast('Not in the prototype.');
});
document.addEventListener('change', e => {
  if (e.target.id==='sel-view'){ S.view = e.target.value; S.overlay = null; render(); window.scrollTo(0,0); }
  if (e.target.id==='sel-phase') setPhase(e.target.value);
});
document.addEventListener('input', e => {
  if (e.target.id==='ans'){ S.answer = e.target.value; const p = document.getElementById('ans-preview'); if (p) p.innerHTML = k(S.answer, true); }
  if (e.target.id==='reason'){ S.reason = e.target.value; }
  if (e.target.id==='eps'){ S.eps = +e.target.value; refreshFig(); }
  if (e.target.matches && e.target.matches('.d-composer textarea')){ e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 160) + 'px'; }
});
function refreshFig(){
  const svgHost = document.querySelector('#root svg[aria-label^="Graph"]');
  if (!svgHost) return;
  const pal = {D:DPAL,
    A:{bg:'#fff',axis:'#9AA3AE',curve:'#1D2433',eps:'#24477A',delta:'#8A6D1E',good:'#2E6B4E',bad:'#C2362B',text:'#5B6475'},
    C:{bg:'#fff',axis:'#B8BDCB',curve:'#171A26',eps:'#3F51D9',delta:'#B86E00',good:'#1E8F4F',bad:'#C93636',text:'#5F6679'}}[S.variant];
  // replace only the svg and its caption line so the slider keeps focus
  const caption = svgHost.nextElementSibling;
  const tmp = document.createElement('div'); tmp.innerHTML = epsFig(pal);
  svgHost.replaceWith(tmp.firstElementChild);
  if (caption) caption.replaceWith(tmp.lastElementChild);
}
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.closest && t.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key==='h' || e.key==='H'){ const b = document.getElementById('bar'); b.style.display = b.style.display==='none' ? '' : 'none'; return; }
  if (e.key==='ArrowLeft') return cycle(-1);
  if (e.key==='ArrowRight') return cycle(1);
  if (S.view!=='session') return;
  if (S.phase==='check' && ['1','2','3'].includes(e.key)) return setConf(CONFS[+e.key-1]);
  if (S.variant==='D' && S.phase==='check' && S.q===1 && 'abcd'.includes(e.key.toLowerCase()) && e.key.length===1){ S.pick = 'abcd'.indexOf(e.key.toLowerCase()); render(); return; }
  if (S.phase==='discuss' && (e.key==='r' || e.key==='R')) return setPhase('check');
  if (e.key==='Escape' && S.overlay){ S.overlay=null; render(); }
});
render();
</script>
</body>
